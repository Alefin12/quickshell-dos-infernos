[config]
# ...
[templates.quickshell]
input_path = 'templates/quickshell.json'
output_path = '~/.local/state/quickshell/generated/colors.json'
# ...
[templates.vscode-raw]
input_path = 'templates/vscode-colors'
output_path = '~/.cache/matugen/vscode-colors'

[templates.vscode-json]
input_path = 'templates/vscode-colors.json'
output_path = '~/.cache/matugen/vscode-colors.json'

[templates.millennium]
input_path = 'templates/matugentemplate.css'
output_path = '~/.steam/steam/millennium/themes/Material-Theme/css/main/colors/matugen.css'

[templates.kitty]
input_path = 'templates/kitty-colors.conf'
output_path = '~/.config/kitty/themes/Matugen.conf'
post_hook = "kitty +kitten themes --reload-in=all Matugen"
# ...

[templates.vesktop]
input_path = 'templates/system24.css'
output_path = '/home/bigboss/.config/BetterDiscord/themes/system24.theme.css'
# ...

# ...
[templates.hyprland]
input_path = 'templates/hyprland-colors.lua'
output_path = '~/.config/hypr/modules/colors.lua' # If using lua config replace *.conf* with *.lua* at the end
# ...

# ...
[templates.pywalfox]
input_path = 'templates/pywalfox-colors.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'pywalfox update'
# ...

[templates.btop]
input_path = 'templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = 'pkill -USR2 btop || true'
# ...

[templates.cava]
input_path = 'templates/cava-colors.ini'
output_path = '~/.config/cava/themes/your-theme'
post_hook = 'pkill -USR1 cava'
# ...